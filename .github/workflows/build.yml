name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: |
        set -o pipefail
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

    - name: Upload Build Log if Failed
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Locate APK
      run: |
        find . -name "*.apk" || true
        mkdir -p release_files
        find . -name "*.apk" -exec cp {} release_files/WakeOnLAN-debug.apk \; || true
        ls -la release_files/

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.1
        name: "WakeOnLAN v1.0.1"
        draft: false
        prerelease: false
        files: release_files/WakeOnLAN-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
